<script>
(function () {
  const walk = JSON.parse(document.getElementById("walk-data").textContent);
  const isBlueprint = walk.kind === "blueprint";
  const stops = walk.stops || [];
  const domains = walk.domains || [];
  const domainById = Object.fromEntries(domains.map((d) => [d.id, d]));
  const featureById = Object.fromEntries((walk.features || []).map((f) => [f.id, f]));
  const allFlags = stops.flatMap((s) => (s.flags || []).map((f) => ({ ...f, stop: s })));
  const redFlags = allFlags.filter((f) => f.level === "red");
  const yellowFlags = allFlags.filter((f) => f.level === "yellow");

  const state = { acks: {}, review: null, db: null, uid: null, comments: null, canWrite: false, confirming: false };

  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v === undefined || v === null || v === false) continue;
      if (k === "class") el.className = v;
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? "" : v);
    }
    for (const kid of kids.flat()) {
      if (kid === null || kid === undefined || kid === false) continue;
      el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
    }
    return el;
  }

  const CATEGORY = { "deviation": "Deviation from plan", "security": "Security & data", "blast-radius": "Blast radius", "debt": "Debt & inefficiency", "unresolved": "Unresolved review issue" };
  const CATEGORY_ORDER = ["deviation", "security", "blast-radius", "unresolved", "debt"];
  const CHANGE = { "new": "New", "modified": "Changed", "removed": "Removed", "unchanged": "Touched" };
  const DOMAIN_CHANGE = { "modified": "Changed", "new": "New", "removed": "Removed", "untouched": "Unchanged" };
  const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ---------- masthead + features ----------
  function renderMasthead() {
    const m = document.getElementById("masthead");
    m.replaceChildren(
      h("div", { class: "eyebrow" },
        isBlueprint ? "Blueprint walk · before any code is written" : "As-built walk · what was actually built",
        walk.example ? h("span", { class: "example-tag" }, "Example data") : null),
      h("h1", {}, walk.headline),
      walk.purpose ? h("p", { class: "purpose" }, walk.purpose) : null,
      h("div", { class: "meta" },
        h("span", {}, walk.batch.name, " ", h("span", { class: "idref" }, walk.batch.id)),
        walk.branch ? h("span", { class: "idref" }, `${walk.branch} → ${walk.base || "main"}`) : null,
        walk.generated_at ? h("span", {}, `Prepared ${walk.generated_at}`) : null,
        walk.blueprint_url ? h("a", { href: walk.blueprint_url, target: "_blank", rel: "noopener" }, "Open the blueprint walk") : null)
    );
  }

  function renderFeatures() {
    document.getElementById("features").replaceChildren(
      h("h3", {}, isBlueprint ? "What this batch will deliver" : "What this batch delivered"),
      h("ul", { class: "features" }, (walk.features || []).map((f) =>
        h("li", {},
          h("span", { class: `pill ${f.status}` }, f.status),
          h("div", {}, h("strong", {}, f.name), f.note ? h("div", { class: "hint" }, f.note) : null),
          h("span", { class: "idref" }, f.id)))));
  }

  // ---------- maps ----------
  function renderMapText() {
    document.getElementById("fp-caption").textContent = walk.floorplan_caption || "";
    document.getElementById("system-legend").replaceChildren(
      ...domains.map((d) => h("span", { class: `dom-${d.colour}` }, h("i", { class: "sw" }), d.name)),
      h("span", {}, h("i", { class: "sw touched" }), "Touched by this batch"),
      domains.some((d) => d.change === "new") ? h("span", {}, h("i", { class: "sw newdom" }), "New domain") : null);
  }

  // Mermaid renders after load, so colour and wire up the SVG whenever it appears.
  function nodesById(root, sel, id) {
    if (!id) return [];
    const safe = id.replace(/[^A-Za-z0-9_]/g, "");
    const re = new RegExp(`(^|-)${safe}(-\\d+)?$`);
    return [...root.querySelectorAll(sel)].filter((el) => re.test(el.id || ""));
  }
  function makeJump(el, stop, label) {
    el.classList.add("jump");
    el.setAttribute("tabindex", "0");
    el.setAttribute("role", "link");
    el.setAttribute("aria-label", label);
    el.addEventListener("click", () => goToStop(stop));
    el.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); goToStop(stop); } });
  }
  function goToStop(s) {
    const t = document.getElementById(`stop-${s.id}`);
    if (!t) return;
    if (openViewer) setExpanded(openViewer, false);
    t.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "start" });
    t.focus({ preventScroll: true });
  }
  function backToMap(s) {
    const v = viewers["detail-map"];
    v.fig.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "start" });
    const node = v.svg && nodesById(v.svg, "g.node", s.node)[0];
    if (!node) return;
    focusOn(v, node);
    node.focus({ preventScroll: true });
    node.classList.remove("pulse");
    void node.getBoundingClientRect();
    node.classList.add("pulse");
    setTimeout(() => node.classList.remove("pulse"), 2200);
  }

  // ---------- map viewer ----------
  // Each map opens fitted whole. Drag pans; ctrl/⌘+scroll or pinch zooms (plain scroll in the
  // expanded view). The svg is kept at its natural size and moved with a CSS transform.
  const viewers = {};
  let openViewer = null;
  function setupViewer(fig) {
    const vp = fig.querySelector(".viewport");
    const v = { fig, vp, svg: null, W: 0, H: 0, k: 1, x: 0, y: 0, fitK: 1, moved: false, dragged: false };
    const zoomBy = (f) => zoomAt(v, f, vp.clientWidth / 2, vp.clientHeight / 2);
    v.hint = h("span", { class: "hint" });
    v.expandBtn = h("button", { type: "button", onclick: () => setExpanded(v, !fig.classList.contains("expanded")) });
    fig.prepend(h("div", { class: "map-tools" }, v.hint,
      h("div", { class: "btns" },
        h("button", { type: "button", "aria-label": "Zoom out", onclick: () => zoomBy(1 / 1.4) }, "−"),
        h("button", { type: "button", "aria-label": "Zoom in", onclick: () => zoomBy(1.4) }, "+"),
        h("button", { type: "button", "aria-label": "Fit the whole map", onclick: () => fit(v) }, "Fit"),
        v.expandBtn)));
    setExpandedLabels(v, false);

    const pts = new Map();
    let start = null;
    vp.addEventListener("pointerdown", (e) => {
      if (e.pointerType === "mouse" && e.button !== 0) return;
      pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (pts.size === 1) { v.dragged = false; start = { x: e.clientX, y: e.clientY }; }
    });
    vp.addEventListener("pointermove", (e) => {
      const p = pts.get(e.pointerId);
      if (!p || !v.svg) return;
      if (pts.size === 1) {
        if (!v.dragged && Math.hypot(e.clientX - start.x, e.clientY - start.y) < 4) return;
        if (!v.dragged) { v.dragged = true; vp.setPointerCapture(e.pointerId); vp.classList.add("dragging"); }
        v.x += e.clientX - p.x; v.y += e.clientY - p.y;
        v.moved = true; clampPan(v); apply(v);
      } else if (pts.size === 2) {
        const [a, b] = [...pts.values()];
        const before = Math.hypot(a.x - b.x, a.y - b.y);
        p.x = e.clientX; p.y = e.clientY;
        const after = Math.hypot(a.x - b.x, a.y - b.y);
        const r = vp.getBoundingClientRect();
        v.dragged = true;
        if (before > 0) zoomAt(v, after / before, (a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top);
      }
      p.x = e.clientX; p.y = e.clientY;
    });
    const end = (e) => {
      pts.delete(e.pointerId);
      if (!pts.size) vp.classList.remove("dragging");
      else start = { ...pts.values().next().value };
    };
    vp.addEventListener("pointerup", end);
    vp.addEventListener("pointercancel", end);
    // A drag that ends over a node must not also count as a click on it.
    vp.addEventListener("click", (e) => { if (v.dragged) { e.stopPropagation(); e.preventDefault(); v.dragged = false; } }, true);
    vp.addEventListener("wheel", (e) => {
      if (!v.svg || (!fig.classList.contains("expanded") && !e.ctrlKey && !e.metaKey)) return;
      e.preventDefault();
      const r = vp.getBoundingClientRect();
      zoomAt(v, Math.exp(-e.deltaY * (e.deltaMode ? 0.05 : 0.0025)), e.clientX - r.left, e.clientY - r.top);
    }, { passive: false });
    viewers[fig.id] = v;
  }
  // Called whenever mermaid (re)draws a map, or finishes laying one out.
  function attachSvg(v, svg) {
    const box = svg.viewBox && svg.viewBox.baseVal;
    if (!box || !box.width) return;
    const dims = `${box.width}x${box.height}`;
    if (v.svg === svg && svg.dataset.viewer === dims) return;
    svg.dataset.viewer = dims;
    v.svg = svg; v.W = box.width; v.H = box.height;
    svg.style.width = `${v.W}px`;
    svg.style.height = `${v.H}px`;
    size(v); fit(v);
  }
  function size(v) {
    if (v.fig.classList.contains("expanded") || !v.W) return;
    const cap = Math.max(220, window.innerHeight * 0.6);
    v.vp.style.height = `${Math.round(Math.min(cap, Math.max(140, v.H * Math.min(1, v.vp.clientWidth / v.W) + 16)))}px`;
  }
  function fit(v) {
    if (!v.W) return;
    const vw = v.vp.clientWidth, vh = v.vp.clientHeight;
    v.fitK = v.k = Math.min(1, (vw - 16) / v.W, (vh - 16) / v.H);
    v.x = (vw - v.W * v.k) / 2; v.y = (vh - v.H * v.k) / 2;
    v.moved = false; apply(v);
  }
  function apply(v) { v.svg.style.transform = `translate(${v.x}px, ${v.y}px) scale(${v.k})`; }
  // Keep the map in view: centred when it fits on an axis, otherwise edge-to-edge at most.
  function clampPan(v) {
    const vw = v.vp.clientWidth, vh = v.vp.clientHeight, w = v.W * v.k, hh = v.H * v.k;
    v.x = w <= vw ? (vw - w) / 2 : Math.min(8, Math.max(vw - w - 8, v.x));
    v.y = hh <= vh ? (vh - hh) / 2 : Math.min(8, Math.max(vh - hh - 8, v.y));
  }
  function zoomAt(v, factor, cx, cy) {
    if (!v.svg) return;
    const k = Math.min(3, Math.max(v.fitK * 0.6, v.k * factor));
    v.x = cx - (cx - v.x) * (k / v.k); v.y = cy - (cy - v.y) * (k / v.k);
    v.k = k; v.moved = true; clampPan(v); apply(v);
  }
  // Pan and zoom so a node sits in the middle at a readable size.
  function focusOn(v, el) {
    const r = el.getBoundingClientRect(), s = v.svg.getBoundingClientRect();
    const nx = (r.left + r.width / 2 - s.left) / v.k, ny = (r.top + r.height / 2 - s.top) / v.k;
    v.k = Math.max(v.fitK, 1);
    v.x = v.vp.clientWidth / 2 - nx * v.k; v.y = v.vp.clientHeight / 2 - ny * v.k;
    v.moved = true; clampPan(v);
    v.svg.classList.add("glide"); apply(v);
    setTimeout(() => v.svg && v.svg.classList.remove("glide"), 400);
  }
  function setExpandedLabels(v, on) {
    v.hint.textContent = on ? "Drag to move · scroll or pinch to zoom · Esc to close" : "Drag to move · Ctrl/⌘ + scroll or pinch to zoom";
    v.expandBtn.textContent = on ? "Close" : "Expand";
    v.expandBtn.setAttribute("aria-label", on ? "Close the full-window map" : "Open the map full-window");
  }
  function setExpanded(v, on) {
    v.fig.classList.toggle("expanded", on);
    document.documentElement.classList.toggle("map-open", on);
    setExpandedLabels(v, on);
    if (on) { v.returnFocus = document.activeElement; openViewer = v; v.expandBtn.focus(); }
    else {
      openViewer = null;
      if (v.returnFocus && v.returnFocus.isConnected) v.returnFocus.focus({ preventScroll: true });
    }
    requestAnimationFrame(() => { size(v); fit(v); if (!on) v.fig.scrollIntoView({ block: "nearest" }); });
  }
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && openViewer) setExpanded(openViewer, false); });
  let resizeQueued = false;
  window.addEventListener("resize", () => {
    if (resizeQueued) return;
    resizeQueued = true;
    requestAnimationFrame(() => {
      resizeQueued = false;
      for (const v of Object.values(viewers)) {
        if (!v.svg) continue;
        size(v);
        if (v.moved) { clampPan(v); apply(v); } else fit(v);
      }
    });
  });

  // Mermaid draws in steps (nodes before subgraphs), so this runs once drawing settles
  // and is safe to repeat.
  function enhanceMaps() {
    for (const v of Object.values(viewers)) {
      const svg = v.vp.querySelector("svg");
      if (!svg) continue;
      // classDef colours arrive as inline !important styles, which no stylesheet can override.
      for (const el of svg.querySelectorAll("g.node :is(rect, polygon, circle, ellipse, path)")) {
        for (const prop of ["fill", "stroke", "stroke-width", "stroke-dasharray"]) el.style.removeProperty(prop);
      }
      attachSvg(v, svg);
    }
    const sys = document.querySelector("#system-map svg");
    if (sys) {
      for (const d of domains) {
        const first = stops.find((s) => s.domain === d.id);
        for (const el of nodesById(sys, "g.node", d.id)) {
          el.classList.add(`dom-${d.colour}`, `chg-${d.change || "untouched"}`);
          if (first && !el.classList.contains("jump")) makeJump(el, first, `${d.name}, ${DOMAIN_CHANGE[d.change] || ""}: go to its first stop`);
        }
      }
    }
    const det = document.querySelector("#detail-map svg");
    if (det) {
      for (const d of domains) {
        for (const el of nodesById(det, "g.cluster", d.id)) el.classList.add(`dom-${d.colour}`);
      }
      stops.forEach((s, i) => {
        for (const el of nodesById(det, "g.node", s.node)) {
          if (!el.classList.contains("jump")) makeJump(el, s, `Stop ${i + 1}: ${s.title}`);
        }
      });
    }
  }

  // ---------- issues ----------
  function renderIssues() {
    document.getElementById("issues-hint").textContent = isBlueprint
      ? "Everything we can already foresee. Redirect anything now and it costs nothing."
      : "Every flag on the walk. Red needs your call on its stop; yellow is for awareness.";
    const byCategory = (a, b) => CATEGORY_ORDER.indexOf(a.category) - CATEGORY_ORDER.indexOf(b.category);
    const row = (f) => {
      const i = stops.indexOf(f.stop);
      const ack = state.acks[f.id];
      const status = f.level !== "red" ? null
        : !ack ? h("span", { class: "pill todo" }, "Your call")
        : ack.verdict === "ok" ? h("span", { class: "pill pass" }, "OK")
        : h("span", { class: "pill fail" }, "Change");
      return h("li", { class: "issue" },
        h("span", { class: `dot ${f.level}`, "aria-hidden": "true" }),
        h("div", {},
          h("a", { class: "issue-title", href: `#flag-${f.id}` }, f.title),
          h("span", { class: "hint" }, `${CATEGORY[f.category] || f.category} · Stop ${i + 1}, ${f.stop.title}`)),
        status);
    };
    const group = (title, flags) => flags.length
      ? h("div", { class: "issue-group" }, h("h3", {}, `${title} · ${flags.length}`), h("ul", { class: "issues" }, [...flags].sort(byCategory).map(row)))
      : null;
    const el = document.getElementById("issues");
    if (!allFlags.length) { el.replaceChildren(h("p", {}, "No issues, inefficiencies or risks were raised on this walk.")); return; }
    el.replaceChildren(group("Needs your call", redFlags), group("For awareness", yellowFlags));
  }

  // ---------- route ----------
  function domainChip(id) {
    const d = domainById[id];
    return d ? h("span", { class: `chip dom-${d.colour}` }, d.name) : null;
  }
  function renderRoute() {
    document.getElementById("route").replaceChildren(...stops.map((s, i) =>
      h("li", {}, h("a", { href: `#stop-${s.id}` },
        h("span", { class: "num" }, i + 1),
        h("span", {}, h("strong", {}, s.title), domainChip(s.domain)),
        h("span", { class: "dots", "aria-label": flagSummary(s) },
          (s.flags || []).map((f) => h("span", { class: `dot ${f.level}` })))))));
  }
  function flagSummary(s) {
    const r = (s.flags || []).filter((f) => f.level === "red").length;
    const y = (s.flags || []).filter((f) => f.level === "yellow").length;
    return `${r} red, ${y} yellow flags`;
  }

  // ---------- stops ----------
  function renderStops() {
    document.getElementById("stops").replaceChildren(...stops.map(renderStop));
  }

  function renderStop(s, i) {
    const featureNames = (s.features || []).map((id) => (featureById[id] ? featureById[id].name : id));
    const el = h("article", { class: "stop", id: `stop-${s.id}`, tabindex: "-1", "data-comment-target": true },
      h("div", { class: "stop-head" },
        h("span", { class: "num", "aria-hidden": "true" }, i + 1),
        h("div", { class: "stop-title" },
          h("div", { class: "crumb" },
            domainChip(s.domain),
            h("span", {}, `Stop ${i + 1} of ${stops.length}`),
            s.node ? h("a", { class: "back", href: "#detail-map", onclick: (e) => { e.preventDefault(); backToMap(s); } }, "Back to map") : null),
          h("h2", {}, s.title),
          h("div", { class: "stop-sub" },
            h("span", { class: `pill ${s.change}` }, CHANGE[s.change] || s.change),
            featureNames.length ? h("span", {}, featureNames.join(" · ")) : null,
            s.component ? h("span", { class: "idref" }, s.component) : null))),
      h("div", { class: "twocol" },
        h("div", { class: "block" }, h("h3", {}, isBlueprint ? "What will change" : "What changed"), h("p", {}, s.what)),
        h("div", { class: "block" }, h("h3", {}, "Why"), h("p", {}, s.why))),
      (s.ripple || []).length ? h("div", { class: "block" }, h("h3", {}, "Knock-on effects"),
        h("ul", {}, s.ripple.map((r) => h("li", {}, r)))) : null,
      (s.decisions || []).length ? h("div", { class: "block" }, h("h3", {}, "Design calls"),
        s.decisions.map((d) => h("div", { class: "decision" },
          h("strong", {}, d.choice),
          d.alternatives ? h("span", { class: "alt" }, "Instead of: ", d.alternatives) : null,
          d.why ? h("span", {}, d.why) : null))) : null,
      (s.proof || []).length ? h("div", { class: "block" }, h("h3", {}, isBlueprint ? "How we'll know it works" : "Evidence it works"),
        h("ul", { class: "proof" }, s.proof.map(renderProof))) : null,
      (s.flags || []).length ? h("div", { class: "flags" }, s.flags.map((f) => renderFlag(f, s))) : null,
      renderAsk(s, i),
      renderReviewerDetail(s));
    return el;
  }

  function renderProof(p) {
    const status = p.status || (isBlueprint ? "planned" : "");
    if (p.type === "behaviour") {
      return h("li", {}, h("span", { class: `pill ${status}` }, status || "run"),
        h("div", {}, h("div", {}, p.text),
          h("dl", { class: "ba" }, h("dt", {}, "Before"), h("dd", {}, p.before || "—"), h("dt", {}, "After"), h("dd", {}, p.after || "—"))));
    }
    return h("li", {}, h("span", { class: `pill ${status}` }, status || "test"), h("span", {}, p.text));
  }

  // Caught-in-review findings and the diff: kept for anyone who wants them, closed by default.
  function renderReviewerDetail(s) {
    const c = s.caught || [];
    if (!c.length && !s.diff) return null;
    const parts = [];
    if (c.length) parts.push(`${c.length} caught in review`);
    let diffBlock = null;
    if (s.diff) {
      const lines = s.diff.replace(/\n$/, "").split("\n");
      let add = 0, del = 0; const files = new Set();
      const spans = lines.map((ln) => {
        let k = "";
        if (ln.startsWith("diff --git")) { k = "f"; const m = ln.match(/ b\/(.+)$/); if (m) files.add(m[1]); }
        else if (ln.startsWith("@@")) k = "h";
        else if (ln.startsWith("+") && !ln.startsWith("+++")) { k = "a"; add++; }
        else if (ln.startsWith("-") && !ln.startsWith("---")) { k = "d"; del++; }
        return h("span", { class: k }, ln || " ");
      });
      parts.push(`diff: ${files.size} file${files.size === 1 ? "" : "s"}, +${add} −${del}`);
      diffBlock = h("div", { class: "block" }, h("h3", {}, "Code diff"), h("div", { class: "diff-body" }, h("pre", {}, spans)));
    }
    return h("details", { class: "reviewer" },
      h("summary", {}, `Reviewer detail · ${parts.join(" · ")}`),
      c.length ? h("div", { class: "block" }, h("h3", {}, "Caught in review, fixed before you saw it"),
        h("ul", { class: "caught" }, c.map((x) => h("li", {}, h("span", { class: "sev" }, x.severity || ""),
          h("span", {}, x.title, x.pass ? h("span", { class: "hint" }, ` · ${x.pass}`) : null))))) : null,
      diffBlock);
  }

  function renderFlag(f, s) {
    const label = `${f.level === "red" ? "Red" : "Yellow"} · ${CATEGORY[f.category] || f.category}`;
    const card = h("div", { class: `flag ${f.level}`, id: `flag-${f.id}` },
      h("div", { class: "flag-top" }, h("span", { class: "flag-label" }, label),
        f.level === "red" ? verdictControl(f) : h("span", { class: "awareness" }, "No action needed")),
      h("div", { class: "flag-title" }, f.title),
      f.detail ? h("div", { class: "flag-detail" }, f.detail) : null);
    if (f.level === "red") {
      const ack = state.acks[f.id];
      if (ack && ack.verdict === "change") {
        const ta = h("textarea", { class: "note", id: `note-${f.id}`, placeholder: "What should change? (optional, but it helps)", maxlength: "2000", disabled: !state.canWrite });
        ta.value = ack.note || "";
        ta.addEventListener("input", () => scheduleNote(f.id, ta.value));
        card.append(ta);
        const sendRow = renderFlagSend(f, s, ta);
        if (sendRow) card.append(sendRow);
      }
    }
    return card;
  }

  function renderFlagSend(f, s, ta) {
    if (!state.comments) return null;
    const msg = h("span", { class: "hint", role: "status" });
    const btn = h("button", {
      type: "button", class: "btn", disabled: !state.canWrite || state.review,
      onclick: async () => {
        const text = ta.value.trim();
        if (!text) { msg.textContent = "Type what should change first."; return; }
        btn.disabled = true; msg.textContent = "Sending…";
        clearTimeout(noteTimers[f.id]);
        const prev = state.acks[f.id] || {};
        const next = { ...prev, verdict: "change", note: text, by: state.uid, at: new Date().toISOString() };
        state.acks[f.id] = next;
        try {
          await enqueue(f.id, () => state.db.collection("acks").doc(f.id).set(next));
        } catch (e) { /* still try to notify; the note is in memory either way */ }
        if (state.canSend) {
          try {
            const el = document.getElementById(`flag-${f.id}`);
            const anchor = await state.comments.anchorFor(el);
            await state.comments.sendToClaude({
              anchor,
              text: `Requesting a change on a ${f.level} ${CATEGORY[f.category] || f.category} flag, stop "${s.title}": "${f.title}".\n\n${text}`
            });
            msg.textContent = "Sent. Claude will reply in the comment thread on this flag.";
          } catch (e) {
            msg.textContent = e && e.code === "consent_required" ? "Saved, but not sent: commenting from this page needs your permission." : "Saved, but not sent. Your note is still here; try again in a moment.";
          }
        } else {
          msg.textContent = "Saved.";
        }
        btn.disabled = false;
      }
    }, "Send to Claude");
    return h("div", { style: "display:flex;gap:12px;align-items:center;flex-wrap:wrap" }, btn, msg);
  }

  function verdictControl(f) {
    const ack = state.acks[f.id];
    const mk = (v, text) => h("button", {
      type: "button", class: v, "aria-pressed": ack && ack.verdict === v ? "true" : "false",
      disabled: !state.canWrite || state.review,
      onclick: () => setVerdict(f.id, v)
    }, text);
    return h("div", { class: "verdict", role: "group", "aria-label": `Your call on: ${f.title}` }, mk("ok", "OK"), mk("change", "Change this"));
  }

  function renderAsk(s, i) {
    if (!state.comments) return null;
    const wrap = h("div", { class: "ask" });
    const open = h("button", { type: "button", class: "btn", onclick: () => openAsk() }, state.canSend ? "Ask Claude about this stop" : "Comment on this stop");
    wrap.append(open);
    function openAsk() {
      const stopEl = document.getElementById(`stop-${s.id}`);
      if (!state.canSend) {
        state.comments.openComposer({ element: stopEl }).catch(() => { open.disabled = true; });
        return;
      }
      const ta = h("textarea", { class: "note", id: `ask-${s.id}`, placeholder: "e.g. What happens to in-flight orders during deploy?", maxlength: "3500" });
      const msg = h("span", { class: "hint", role: "status" });
      const send = h("button", { type: "button", class: "btn primary", onclick: async () => {
        const text = ta.value.trim();
        if (!text) { msg.textContent = "Type a question first."; return; }
        send.disabled = true; msg.textContent = "Sending…";
        try {
          const anchor = await state.comments.anchorFor(stopEl);
          await state.comments.sendToClaude({ anchor, text: `${text}\n\n(Asked on a floor-walk page, about stop ${i + 1}: ${s.title}${s.component ? " (" + s.component + ")" : ""}. Answer about what this stop changes, using the repo.)` });
          ta.value = ""; msg.textContent = "Sent. Claude will reply in the comment thread on this stop.";
        } catch (e) {
          msg.textContent = e && e.code === "consent_required" ? "Not sent: commenting from this page needs your permission." : "Not sent. Your question is still here; try again in a moment.";
        } finally { send.disabled = false; }
      } }, "Send to Claude");
      wrap.replaceChildren(ta, h("div", { style: "display:flex;gap:12px;align-items:center;flex-wrap:wrap" }, send, msg));
      ta.focus();
    }
    return wrap;
  }

  // ---------- review bar ----------
  function renderBar() {
    const bar = document.getElementById("bar-inner");
    const marked = redFlags.filter((f) => state.acks[f.id]).length;
    const changes = redFlags.filter((f) => state.acks[f.id] && state.acks[f.id].verdict === "change");
    const pct = redFlags.length ? Math.round((marked / redFlags.length) * 100) : 100;

    if (state.review) {
      bar.replaceChildren(h("span", {}, state.review.verdict === "approved"
        ? "Review finished: approved."
        : `Review finished: ${state.review.changes.length} change${state.review.changes.length === 1 ? "" : "s"} requested.`),
        h("span", { class: "hint" }, "Claude picks it up from here."));
      return;
    }
    if (!state.db) {
      bar.replaceChildren(h("span", { class: "hint" }, "Marking flags is unavailable in this view. Read the walk, then tell Claude your calls in the terminal."));
      return;
    }
    if (state.confirming) {
      const note = h("textarea", { class: "note", id: "final-note", placeholder: "Anything else for Claude? (optional)", maxlength: "2000" });
      const msg = h("span", { class: "hint", role: "status" });
      const go = h("button", { type: "button", class: changes.length ? "btn danger" : "btn primary", onclick: () => finish(note.value, msg, go) },
        changes.length ? `Confirm: send back with ${changes.length} change${changes.length === 1 ? "" : "s"}` : "Confirm: approve this walk");
      bar.replaceChildren(h("div", { class: "confirm" }, note,
        h("div", { style: "display:flex;gap:10px;flex-wrap:wrap;align-items:center" }, go,
          h("button", { type: "button", class: "btn", onclick: () => { state.confirming = false; renderBar(); } }, "Back"), msg)));
      return;
    }
    const ready = marked === redFlags.length;
    bar.replaceChildren(
      h("div", { class: "progress" },
        h("span", {}, redFlags.length ? `Red flags marked: ${marked} of ${redFlags.length}` : "No red flags on this walk"),
        h("div", { class: "track", "aria-hidden": "true" }, h("div", { style: `width:${pct}%` }))),
      h("button", { type: "button", class: changes.length ? "btn danger" : "btn primary", disabled: !ready || !state.canWrite,
        onclick: () => { state.confirming = true; renderBar(); } },
        !ready ? "Mark every red flag to finish" : changes.length ? `Send back with ${changes.length} change${changes.length === 1 ? "" : "s"}` : "Approve walk"));
  }

  async function finish(noteText, msg, btn) {
    btn.disabled = true; msg.textContent = "Saving…";
    const changes = redFlags.filter((f) => state.acks[f.id] && state.acks[f.id].verdict === "change").map((f) => f.id);
    const verdict = changes.length ? "changes_requested" : "approved";
    const review = { verdict, changes, note: noteText.trim(), by: state.uid, at: new Date().toISOString() };
    try {
      await state.db.doc("review/state").set(review);
    } catch (e) {
      msg.textContent = "Not saved. Check your connection and try again."; btn.disabled = false; return;
    }
    let told = false;
    if (state.comments && state.canSend) {
      const summary = verdict === "approved"
        ? `Review finished: walk approved.${review.note ? " Note: " + review.note : ""}`
        : `Review finished: ${changes.length} change(s) requested on ${changes.join(", ")}. Notes are on each flag.${review.note ? " Note: " + review.note : ""}`;
      try {
        const anchor = await state.comments.anchorFor(document.getElementById("masthead"));
        await state.comments.sendToClaude({ anchor, text: summary });
        told = true;
      } catch (e) { /* fall through to the terminal hint */ }
    }
    state.review = review; state.confirming = false;
    renderBar(); rerenderFlags(); renderBanner();
    if (!told) {
      document.getElementById("bar-inner").append(h("span", { class: "hint" }, "Saved. Tell Claude in the terminal that you've finished the review."));
    }
  }

  function renderBanner() {
    const b = document.getElementById("review-banner");
    if (!state.review) { b.hidden = true; return; }
    b.hidden = false;
    b.className = `banner ${state.review.verdict === "approved" ? "approved" : "changes"}`;
    b.textContent = state.review.verdict === "approved"
      ? `Approved ${state.review.at ? state.review.at.slice(0, 10) : ""}.`
      : `Sent back with ${state.review.changes.length} change${state.review.changes.length === 1 ? "" : "s"} requested.`;
  }

  // ---------- writes ----------
  const queues = {};
  function enqueue(id, fn) {
    queues[id] = (queues[id] || Promise.resolve()).then(fn, fn);
    return queues[id];
  }
  async function setVerdict(flagId, verdict) {
    if (!state.db || !state.canWrite || state.review) return;
    const prev = state.acks[flagId] || {};
    const next = { verdict, note: verdict === "change" ? (prev.note || "") : "", by: state.uid, at: new Date().toISOString() };
    state.acks[flagId] = next;
    rerenderFlags(); renderBar();
    enqueue(flagId, () => state.db.collection("acks").doc(flagId).set(next)).catch((e) => {
      if (e && e.code === "invalid_argument") { state.canWrite = false; rerenderFlags(); renderBar(); }
    });
  }
  const noteTimers = {};
  function scheduleNote(flagId, text) {
    clearTimeout(noteTimers[flagId]);
    noteTimers[flagId] = setTimeout(() => {
      const ack = state.acks[flagId];
      if (!ack || ack.note === text) return;
      // Bump `at` on every edit, not just on verdict changes — otherwise a snapshot
      // that still reflects the pre-edit note can look no older than this edit to the
      // merge check below, and silently overwrite it in state.acks.
      const next = { ...ack, note: text, at: new Date().toISOString() };
      state.acks[flagId] = next;
      enqueue(flagId, () => state.db.collection("acks").doc(flagId).set(next)).catch(() => {});
    }, 700);
  }

  function rerenderFlags() {
    for (const f of redFlags) {
      const old = document.getElementById(`flag-${f.id}`);
      if (!old) continue;
      const focusedNote = document.activeElement && document.activeElement.id === `note-${f.id}`;
      if (focusedNote) continue; // never yank a textarea out from under the reviewer
      old.replaceWith(renderFlag(f, f.stop));
    }
    renderIssues();
  }

  // ---------- boot ----------
  document.querySelectorAll(".map").forEach(setupViewer);
  renderMasthead(); renderFeatures(); renderMapText(); renderIssues(); renderRoute(); renderStops(); renderBar();
  enhanceMaps();
  let enhanceTimer = 0;
  new MutationObserver(() => { clearTimeout(enhanceTimer); enhanceTimer = setTimeout(enhanceMaps, 80); })
    .observe(document.querySelector("main"), { childList: true, subtree: true });

  (async () => {
    const cl = window.claude;
    if (!cl || !cl.use) return;
    const [db, user, comments] = await Promise.all([cl.use("db"), cl.use("user"), cl.use("comments")]);
    state.db = db; state.comments = comments;
    if (user) {
      state.uid = await user.id();
      const can = await user.can("data.write");
      state.canWrite = !!db && can !== false;
    }
    if (comments && comments.canSendToClaude) {
      try { state.canSend = (await comments.canSendToClaude()) === "available"; } catch (e) { state.canSend = false; }
    }
    renderStops(); renderBar();
    if (!db) return;
    db.collection("acks").onSnapshot((snap) => {
      const acks = {};
      for (const d of snap.docs) acks[d.id] = d.data();
      for (const id of Object.keys(acks)) {
        const mine = state.acks[id];
        if (mine && acks[id].at && mine.at && mine.at > acks[id].at) acks[id] = mine;
      }
      state.acks = acks; rerenderFlags(); renderBar();
    }, () => {});
    db.doc("review/state").onSnapshot((snap) => {
      state.review = snap.exists ? snap.data() : null;
      renderBanner(); renderBar(); rerenderFlags();
    }, () => {});
  })();
})();
</script>
